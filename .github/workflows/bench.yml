# Benchmark copy of langwatch/langwatch's e2e-ci.yml e2e job (path gate, aggregator and Slack
# steps removed). Same services, steps and commit on every runner; only the test step differs.
# Upstream started the api and worker inside the test step; that is its own step here (as on Boba).
# Retries and workers come from dev/tests/agentic-e2e/playwright.config.ts with CI=true.
name: bench
on:
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        options: [boba-turbo, boba-standard, github-16, blacksmith-16, github-4, blacksmith-4]
permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: write

jobs:
  e2e:
    name: e2e (${{ inputs.runner }})
    runs-on: ${{ startsWith(inputs.runner, 'boba') && 'coldtea-boba' || inputs.runner == 'github-16' && 'bench-16' || inputs.runner == 'github-4' && 'ubuntu-latest' || inputs.runner == 'blacksmith-4' && 'blacksmith-4vcpu-ubuntu-2404' || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    # Read the checkout; write only to prune this pull request's older cache copies.
    permissions:
      contents: read
      actions: write
    env:
      # App configuration
      DATABASE_URL: "postgresql://prisma:prisma@localhost:5433/testdb?schema=testdb"
      CLICKHOUSE_URL: "http://default:ci_password@localhost:8123/langwatch"
      IS_OPENSEARCH: "true"
      REDIS_URL: "redis://localhost:6380"
      # The api below starts without dev-stack.sh, so nothing derives a database
      # from its port; the front-door suite reads Better Auth's tokens from the
      # same database only when both are told which one it is.
      REDIS_DB_INDEX: "0"
      LANGWATCH_NLP_SERVICE: "http://localhost:5563"
      LANGEVALS_ENDPOINT: "http://localhost:5564"
      NEXTAUTH_SECRET: "test-secret-for-e2e-testing"
      NEXTAUTH_URL: "http://localhost:5570"
      # The hosted MCP module refuses to install without a public base URL.
      BASE_HOST: "http://localhost:5570"
      API_TOKEN_JWT_SECRET: "test-jwt-secret-for-e2e"
      # Trust the in-repo TEST license keypair so the members suite
      # (dev/tests/agentic-e2e/tests/members/steps.ts withEnterpriseLicense()) can
      # activate a test ENTERPRISE license and exercise member-invitation flows
      # above the free-tier maxMembers=1 cap. Public key only (safe to commit) — matches
      # TEST_PUBLIC_KEY in the enterprise licensing test fixtures.
      # Must be on the app process env before `pnpm start` boots — constants.ts
      # resolves PUBLIC_KEY from this var once at module load. gitleaks:allow
      LANGWATCH_LICENSE_PUBLIC_KEY: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEApmJ61eRR1wxrapjipSmN
        IqYMJPmbonA1d6XV51kdnVs/MdNrrdoWIal6TDt2lHvbAbrEalqR7h+vQzBBZ4St
        ZPqBzTIHQwu3Wjlj7Fj7IeVUiJnRg60W+u9DmYXUeFBlZFMHxV3nNVqedwDcFpV/
        IrAMmSe3QeTqBztcDMBxu5luA4DMU5Hi6kp4qcHDoCCiEH4a6ZZkPdNC+xpFdW41
        75BwdKBKnyOZrUvyPaKrxInra7z+9YQKiggRciQvCNxc76Ef4DLGkTIf36Cvm7XL
        m0gqlJm89dYcRBaDVGFTnb98BM7SrAIg117yjuuw5o/RmSlKq9/Klkz0QsXYF9Zj
        iQIDAQAB
        -----END PUBLIC KEY-----
      # AI Gateway data-plane secrets (shared by control plane + Go gateway).
      # The gateway validates these as required; without them `make service
      # svc=aigateway` crash-loops. Test-only values, 32+ chars.
      LW_GATEWAY_INTERNAL_SECRET: "e2e-gateway-internal-secret-000000000000000000000000000000000000"
      LW_GATEWAY_JWT_SECRET: "e2e-gateway-jwt-secret-00000000000000000000000000000000000000000"
      LW_VIRTUAL_KEY_PEPPER: "e2e-virtual-key-pepper-00000000000000000000000000000000000000000"
      SKIP_ENV_VALIDATION: "true"
      OPS_PII_STRICT_PRESIDIO_REDACTION_DISABLED: "1"
      NODE_ENV: "development"
      # The front-door suite runs passkey ceremonies, served only with the switch on.
      PASSKEYS_ENABLED: "on"
      # The front-door fixtures give each test its own X-Forwarded-For address,
      # read only from a declared hop: the runner reaches the app over loopback.
      TRUSTED_PROXY_ADDRESSES: "127.0.0.1,::1"
      # Test runner configuration
      BASE_URL: "http://localhost:5570"
      CI: "true"

    services:
      postgres:
        image: postgres:16
        ports:
          - 5433:5432
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
        options: >-
          --health-cmd "pg_isready -U prisma"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      clickhouse:
        image: clickhouse/clickhouse-server:26.8.36.3
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ci_password
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      opensearch:
        image: langwatch/opensearch-lite:latest
        ports:
          - 9201:9200
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms256m -Xmx256m"
          cluster.routing.allocation.disk.threshold_enabled: "false"
          bootstrap.memory_lock: "false"
          node.store.allow_mmap: "false"
        options: >-
          --health-cmd "curl -s http://localhost:9200 || exit 1"
          --health-interval 30s
          --health-timeout 30s
          --health-retries 3

      # No nlpgo runs in this job: only `pnpm dev` starts one, and the api and
      # worker below are started directly. LANGWATCH_NLP_SERVICE therefore names
      # a port nothing listens on, so a scenario run is only queued, never
      # executed; the scenario specs assert the queued run or the missing-provider
      # notice. A suite that needs a run to finish starts nlpgo the way
      # sdk-javascript-ci.yml does (go build ./cmd/service, then `nlpgo`).

      langevals:
        image: langwatch/langevals:latest
        ports:
          - 5564:5562
        env:
          DISABLE_EVALUATORS_PRELOAD: "true"
        options: >-
          --health-cmd "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5562/healthcheck')\" || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 30s

    steps:
      - name: Generate a throwaway CREDENTIALS_SECRET
        # The api refuses to boot without a 32-byte hex encryption key. Generated
        # per run: a committed hex literal reads as a leaked key to the scanner.
        run: echo "CREDENTIALS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # docs/media, docs/images and assets/ are 165 MB of marketing
          # .gif/.mp4 that the e2e stack never reads. Naming a sparse-checkout
          # makes checkout fetch with --filter=blob:none, so they never
          # transfer: 180 MB -> 42 MB of .git on a depth-1 clone. The .mdx tree
          # under docs/ stays, because a unit test reads it. Non-cone mode so a
          # new top-level directory arrives by default instead of going missing.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
          sparse-checkout-cone-mode: false

      # This job boots no licence and no Connect, so it runs as sh-free. The mode
      # file answers LANGWATCH_DEPLOYMENT_MODE; $GITHUB_ENV takes assignments only.
      - name: Load the deployment mode
        run: grep -E '^[A-Z_]+=' dev/tests/modes/sh-free.env >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-pnpm-node

      # node-pty@1.1.0 only ships prebuilds for darwin/win32, so on Linux
      # its postinstall always falls back to `node-gyp rebuild`, which pnpm
      # runs with its own vendored node-gyp. That copy ships `gyp/gyp_main.py`
      # mode 644, so an mtime-driven Makefile regeneration executes it and
      # dies with "Permission denied" / error 126. Installing node-gyp
      # globally does not displace it on its own: pnpm exports
      # `npm_config_node_gyp` at its vendored copy and that wins over PATH.
      # Point the variable at the published node-gyp, which ships the script
      # executable. sdk-javascript-ci.yml and npx-server-smoke.yml do the same.
      - name: Install node-gyp (for node-pty postinstall)
        shell: bash
        run: |
          set -euo pipefail
          npm install -g node-gyp@12.3.0
          gyp="$(npm root -g)/node-gyp/bin/node-gyp.js"
          test -f "$gyp"
          test -x "$(dirname "$gyp")/../gyp/gyp_main.py"
          echo "npm_config_node_gyp=$gyp" >> "$GITHUB_ENV"

      # One install for the app, the MCP server (a workspace dependency of the
      # app, so `...` pulls it in) and the Playwright suite. This used to be
      # three separate installs against three lockfiles, one of which needed
      # `--ignore-workspace` to escape a workspace dev/tests/agentic-e2e was never
      # a member of. See ADR-076.
      - name: Install dependencies
        run: >
          CI=true pnpm install --frozen-lockfile
          --filter "@langwatch/platform-api..."
          --filter "@langwatch/worker..."
          --filter "@langwatch/ui..."
          --filter "langwatch-e2e-tests"
          --filter "@langwatch/tasks..."
          --filter "@langwatch/workspace"

      # No Playwright browser/ffmpeg download: the tests launch the runner's
      # preinstalled Google Chrome via channel (E2E_BROWSER_CHANNEL below) and
      # video recording is off in CI, so no ffmpeg binary is needed.

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"

      - name: Prepare files
        run: pnpm start:prepare:files && pnpm ensure:built

      - name: Install goose
        run: bash .github/scripts/install-goose.sh

      # The api and the worker never migrate and refuse to serve until the
      # upgrade has run: the preparation script, `upgrade` then the
      # system-migrations pass (specs/upgrade/entry-points.feature).
      - name: Upgrade the databases
        run: pnpm start:prepare:db

      # The browser bundle only. apps/api and apps/worker run from source
      # through node and have no build of their own.
      - uses: ./.github/actions/nx-cache
        with:
          suffix: e2e

      - name: Build browser bundle
        run: pnpm exec nx run workspace:build:types --outputStyle=static && pnpm exec nx run @langwatch/ui:build --outputStyle=static

      - name: Unit-test the e2e guard
        run: pnpm --filter langwatch-e2e-tests test:unit

      - name: Start the api and worker
        run: |
          API_PORT=5570 pnpm --filter @langwatch/platform-api start &
          pnpm --filter @langwatch/worker start &
          sleep 5

      - name: Run E2E tests on Boba
        if: startsWith(inputs.runner, 'boba')
        uses: coldteadotai/boba@v1
        with:
          working-directory: dev/tests/agentic-e2e
          turbo: ${{ inputs.runner == 'boba-turbo' }}
          fail-fast: false
          playwright-args: --project=unit --project=journey --project=chromium
        env:
          E2E_BROWSER_CHANNEL: chrome
          LANGWATCH_E2E_BASE_URL: "http://localhost:5570"

      - name: Run E2E tests
        if: ${{ !startsWith(inputs.runner, 'boba') }}
        working-directory: dev/tests/agentic-e2e
        run: pnpm test --project=unit --project=journey --project=chromium --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: results.json
          # Launch the runner's preinstalled Google Chrome (no browser download)
          E2E_BROWSER_CHANNEL: chrome
          # The api started below serves the suite; the e2e stack borrows it instead of booting its own.
          LANGWATCH_E2E_BASE_URL: "http://localhost:5570"

      - name: Upload JSON results
        if: ${{ always() && !startsWith(inputs.runner, 'boba') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ inputs.runner }}
          path: dev/tests/agentic-e2e/results.json
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: dev/tests/agentic-e2e/playwright-report/
          retention-days: 7

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: dev/tests/agentic-e2e/test-results/
          retention-days: 7
